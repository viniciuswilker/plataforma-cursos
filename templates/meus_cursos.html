{{ define "meus_cursos" }}
<style>
    .meus-cursos-container {
        margin-top: 40px;
        padding: 0 24px;
        max-width: 1200px;
        margin-left: auto;
        margin-right: auto;
    }

    .section-header {
        margin-bottom: 32px;
    }

    .section-header h1 {
        font-size: 32px;
        font-weight: 800;
        color: #0f172a;
        margin: 0;
    }

    .section-header p {
        color: #64748b;
        margin-top: 8px;
    }

    .grid-meus-cursos {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 32px;
    }

    .my-course-card {
        text-decoration: none;
        color: inherit;
        background: #fff;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #e2e8f0;
        transition: transform 0.2s, box-shadow 0.2s;
        display: flex;
        flex-direction: column;
    }

    .my-course-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1);
        border-color: var(--primary);
    }

    .my-course-img {
        height: 180px;
        background-size: cover;
        background-position: center;
        background-color: #f1f5f9;
    }

    .my-course-body {
        padding: 20px;
        flex-grow: 1;
    }

    .course-status-tag {
        font-size: 11px;
        font-weight: 700;
        color: var(--primary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .my-course-body h3 {
        margin: 8px 0;
        font-size: 18px;
        color: #1e293b;
    }

    .my-course-instructor {
        font-size: 14px;
        color: #64748b;
    }

    .my-course-footer {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid #f1f5f9;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--primary);
        font-weight: 700;
        font-size: 14px;
    }

    .empty-state {
        grid-column: 1 / -1;
        text-align: center;
        padding: 80px 0;
    }

    .empty-state span {
        font-size: 64px;
        color: #cbd5e1;
    }

    .empty-state p {
        margin-top: 16px;
        color: #64748b;
    }
</style>

<div class="meus-cursos-container">
    <div class="section-header">
        <h1>Meus Cursos</h1>
        <p>Continue de onde você parou.</p>
    </div>

    <div class="grid-meus-cursos">
        {{ range .cursos }}
        <a href="/cursos/{{ .ID }}/assistir" class="my-course-card">
            <div class="my-course-img" style="background-image: url('{{ .CapaURL }}');"></div>

            <div class="my-course-body">
                <span class="course-status-tag">Em progresso</span>
                <h3>{{ .Titulo }}</h3>
                <p class="my-course-instructor">Prof. {{ .Instrutor.Nome }}</p>

                <div class="my-course-footer">
                    Continuar estudando
                    <span class="material-symbols-outlined">arrow_forward</span>
                </div>
            </div>
        </a>
        {{ else }}
        <div class="empty-state">
            <span class="material-symbols-outlined">school</span>
            <p>Você ainda não se matriculou em nenhum curso.</p>
            <a href="/feed" class="btn-save-main"
                style="display: inline-block; width: auto; text-decoration: none; margin-top: 24px;">
                Explorar Cursos
            </a>
        </div>
        {{ end }}
    </div>
</div>
{{ end }}
