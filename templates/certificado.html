<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Certificado - {{ .curso.Titulo }}</title>
    <style>
        @page {
            size: A4 landscape;
            margin: 0;
        }

        body {
            margin: 0;
            font-family: 'Georgia', serif;
            background: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .cert-container {
            width: 297mm;
            height: 210mm;
            background: white;
            padding: 50px;
            box-sizing: border-box;
            border: 20px solid #1e293b;
            position: relative;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        }

        .cert-border {
            border: 2px solid #f59e0b;
            height: 100%;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-size: 50px;
            color: #1e293b;
            margin: 0;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 20px;
            color: #64748b;
            margin-top: 10px;
        }

        .student-name {
            font-size: 45px;
            color: #f59e0b;
            margin: 40px 0;
            font-style: italic;
            border-bottom: 2px solid #e2e8f0;
            display: inline-block;
            padding: 0 30px;
        }

        .course-title {
            font-size: 28px;
            color: #1e293b;
            font-weight: bold;
        }

        .footer {
            margin-top: 50px;
            font-size: 16px;
            color: #94a3b8;
        }

        .print-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }

        @media print {
            .print-btn {
                display: none;
            }

            body {
                background: white;
            }

            .cert-container {
                box-shadow: none;
                border: 15px solid #1e293b;
            }
        }
    </style>
</head>

<body>

    <button class="print-btn" onclick="window.print()">Baixar / Imprimir Certificado</button>

    <div class="cert-container">
        <div class="cert-border">
            <p class="subtitle">CERTIFICADO DE CONCLUSÃO</p>
            <h1>EduStream</h1>
            <p style="margin-top: 30px;">Certificamos que</p>
            <div class="student-name">{{ .usuario.Nome }}</div>
            <p>concluiu com êxito o curso de</p>
            <div class="course-title">{{ .curso.Titulo }}</div>
            <div class="footer">
                Emitido em {{ .data }} <br>
                <small>ID de Autenticidade: {{ .curso.ID }}-{{ .usuario.ID }}-2026</small>
            </div>
        </div>
    </div>

</body>

</html>
